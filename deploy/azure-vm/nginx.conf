# /etc/nginx/sites-available/envirolytics
#
# Serves the React build as static files and reverse-proxies /api/* to
# the FastAPI backend on 127.0.0.1:8001. Uploads are also proxied so the
# /api/uploads/aeration/... route (served by FastAPI) works transparently.
#
# TLS: run `certbot --nginx -d monitor.envirolytics.in` after copying
# this file into place; certbot will inject the ssl_certificate lines
# and force-redirect port 80 to 443.

server {
    listen 80;
    listen [::]:80;
    server_name monitor.envirolytics.in;    # <-- change to your domain

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Everything else → HTTPS (certbot will replace this block once it
    # obtains the cert).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.envirolytics.in;    # <-- change to your domain

    # certbot fills these in the first time you run it.
    # ssl_certificate     /etc/letsencrypt/live/monitor.envirolytics.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/monitor.envirolytics.in/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -- Uploads: max size (aeration videos can be up to 100 MB)
    client_max_body_size 120M;

    # -- Static: React production build
    root /opt/envirolytics/frontend/build;
    index index.html;

    # Cache immutable JS/CSS chunks (they carry a content hash in the name)
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -- Backend: everything under /api goes to FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Streaming uploads
        proxy_request_buffering off;
    }

    # -- SPA fallback: any other path → serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
